<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FriendSync Prototyp – Lösungsvariante 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<style>
:root{
--page:#e9ecf1;--bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;--line:#e6e8ec;--ink:#0f172a;--ink2:#64748b;--ink3:#94a3b8;
--accent:#5b5bd6;--accent-soft:#eef0ff;--accent-ink:#4338ca;
--green:#16a34a;--green-soft:#e8f5ec;--green-ink:#15803d;
--amber:#d97706;--amber-soft:#fdf3e3;--amber-ink:#b45309;
--red:#dc2626;--red-soft:#fdecec;--red-ink:#b91c1c;
--blue:#2563eb;--blue-soft:#eaf1fe;--blue-ink:#1d4ed8;
--sh:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.04);
--sh-lg:0 12px 32px -12px rgba(15,23,42,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{background:var(--page);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:15px;letter-spacing:-.006em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.ink2{color:var(--ink2)}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:64px}
.side{display:none;width:380px;flex-direction:column;gap:16px;max-height:100%;overflow:auto;padding:24px 4px;scrollbar-width:none}
.phone{width:100%;height:100%;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.statusbar{display:none}
@media (min-width:520px){.stage{padding:24px 16px}.phone{width:402px;height:min(874px,calc(100vh - 48px));flex-shrink:0;border-radius:52px;border:10px solid #0b0f14;box-shadow:0 0 0 1.5px #2a3038,0 40px 80px -30px rgba(15,23,42,.5)}.statusbar{display:flex}}
@media (min-width:960px){.side{display:flex}}
.statusbar{height:50px;flex-shrink:0;align-items:center;justify-content:space-between;padding:6px 30px 0;font-weight:600;font-size:15px;z-index:5}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scr::-webkit-scrollbar{display:none}
.pad{padding:8px 20px 32px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:14px;font-weight:600;font-size:15px;transition:transform .1s,background .15s,opacity .15s;width:100%;color:#fff;background:var(--ink)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink)}
.btn-primary:hover{background:#1e293b}
.btn-accent{background:var(--accent)}
.btn-accent:hover{background:#4f4fc9}
.btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh)}
.btn-secondary:hover{background:#fafbfc}
.btn-danger{background:#fff;color:var(--red);border:1px solid #f5cdcd}
.btn-glass{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(10px)}
.btn-white{background:#fff;color:var(--ink)}
.btn-sm{height:38px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn:disabled{background:var(--surface2);color:var(--ink3);border-color:transparent;box-shadow:none;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.press{transition:transform .12s,box-shadow .15s}
.press:hover{box-shadow:0 2px 8px -2px rgba(15,23,42,.1)}
.press:active{transform:scale(.985)}
.tap{transition:transform .12s}.tap:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.h1{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.03em}
.h2{font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.h3{font-weight:600;font-size:15.5px;line-height:1.3}
.sub{font-size:13.5px;color:var(--ink2);line-height:1.45}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-green{background:var(--green-soft);color:var(--green-ink)}.c-blue{background:var(--blue-soft);color:var(--blue-ink)}.c-accent{background:var(--accent-soft);color:var(--accent-ink)}.c-amber{background:var(--amber-soft);color:var(--amber-ink)}.c-red{background:var(--red-soft);color:var(--red-ink)}.c-grey{background:var(--surface2);color:var(--ink2)}
.c-dark{background:rgba(15,23,42,.55);color:#fff;backdrop-filter:blur(8px)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;position:relative}
.stack{display:flex}.stack>*{margin-left:-7px;box-shadow:0 0 0 2px #fff}.stack>*:first-child{margin-left:0}
.stack.dark>*{box-shadow:0 0 0 2px rgba(15,23,42,.6)}
.tabbar{flex-shrink:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px 20px;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink3);width:68px;position:relative;padding-top:4px}
.tab.on{color:var(--ink)}
.tab.center.on{color:var(--accent)}
.tab .dot{width:4px;height:4px;border-radius:2px;background:currentColor;opacity:0}
.tab.on .dot{opacity:1}
.badge{position:absolute;top:-2px;left:38px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 3px}
.toggle{width:46px;height:28px;border-radius:999px;background:#dfe3e8;position:relative;flex-shrink:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .2s ease}
.toggle.on{background:var(--ink)}.toggle.on::after{transform:translateX(18px)}
.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>div{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.3,1,.4,1)}
.divider{height:1px;background:var(--line)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;height:34px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink2);transition:background .15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.back{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--sh)}
.back.glass{background:rgba(15,23,42,.35);border-color:transparent;color:#fff;backdrop-filter:blur(10px);box-shadow:none}
.overlay{position:absolute;inset:0;z-index:40;background:rgba(15,23,42,.4);animation:fade .2s both;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 20px 34px;animation:sheetUp .32s cubic-bezier(.2,1,.3,1) both;max-height:88%;overflow:auto}
.grab{width:36px;height:4px;border-radius:2px;background:#d4d8de;margin:0 auto 16px}
.dialog{margin:auto 24px;background:#fff;border-radius:22px;padding:24px;animation:pop .25s cubic-bezier(.2,1,.3,1) both;text-align:center}
.toast{position:absolute;top:58px;left:20px;right:20px;z-index:60;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-weight:500;font-size:14px;display:flex;gap:10px;align-items:center;animation:toastIn .3s cubic-bezier(.2,1,.3,1) both;box-shadow:var(--sh-lg)}
.fade{animation:fade .25s both}.up{animation:up .35s cubic-bezier(.2,1,.3,1) both}.slide{animation:slide .3s cubic-bezier(.2,1,.3,1) both}.pop{animation:pop .35s cubic-bezier(.2,1,.3,1) both}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes slide{from{opacity:0;transform:translateX(20px)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.shake{animation:shake .35s linear 3}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.4}}
.glow{animation:glow 1.8s ease-in-out infinite}
@keyframes ring{from{transform:scale(.7);opacity:.6}to{transform:scale(2);opacity:0}}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid currentColor;animation:ring 2.4s cubic-bezier(.2,.6,.4,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
.shim{background:linear-gradient(90deg,var(--surface2) 0,#fafbfc 50%,var(--surface2) 100%);background-size:400px 100%;animation:shimmer 1.1s linear infinite}
@keyframes orbit{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes check{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.flowbtn{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;transition:transform .1s,border-color .15s;text-align:left;width:100%}
.flowbtn:hover{border-color:#cfd5dc}
.flowbtn:active{transform:scale(.99)}
.flowbtn .n{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--ink2);flex-shrink:0}
.flowbtn.on{border-color:var(--ink)}
.flowbtn.on .n{background:var(--ink);color:#fff}
.slot{border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.slot.busy{background:repeating-linear-gradient(-45deg,#eef0f3 0 6px,#f5f6f8 6px 12px);color:var(--ink3);border:1px solid var(--line)}
.slot.free{background:#fff;border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--green),var(--sh)}
.slot.best{background:var(--accent-soft);border:1px solid #d6d9fb;box-shadow:inset 3px 0 0 var(--accent)}
.photo{background-size:cover;background-position:center;position:relative;overflow:hidden}
.shade::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,0) 30%,rgba(15,23,42,.82) 100%)}
.shade-top::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.45) 0%,rgba(15,23,42,0) 35%);z-index:1}
.photo>.over{position:absolute;z-index:2}
input.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px 0 40px;font-weight:500;outline:none;box-shadow:var(--sh)}
input.search:focus{border-color:var(--ink)}
.lock{position:absolute;inset:0;z-index:45;background:radial-gradient(120% 80% at 20% 0%,#334155 0%,#0f172a 55%,#020617 100%);color:#fff;display:flex;flex-direction:column;animation:fade .3s both}
.mapbg{background-color:#eef1ec;background-image:linear-gradient(#fff 2px,transparent 2px),linear-gradient(90deg,#fff 2px,transparent 2px);background-size:40px 40px}
</style>
</head>

/* ---------- Lockscreen ---------- */
function Lock({onClose}){
 const {go,st,update,pulse}=useApp();const s=st.suggestions.find(x=>x.id==='s1');
 const join=()=>{onClose();const mid='m-s1';if(!st.meetups.find(m=>m.id===mid)){update(x=>({...x,suggestions:x.suggestions.map(y=>y.id==='s1'?{...y,status:'joined'}:y),meetups:[...x.meetups,mkMeet(s)]}))}pulse('#16a34a','Zusage gesendet');go('meetup',{id:mid})};
 return html`<div class="lock">
  <div style=${{textAlign:'center',paddingTop:72}}><div style=${{fontWeight:500,fontSize:17,opacity:.75}}>Freitag, 6. November</div><div style=${{fontSize:88,fontWeight:600,lineHeight:1.05,letterSpacing:'-.04em'}}>${clockStr()}</div></div>
  <div class="col up" style=${{padding:'30px 12px',gap:8,animationDelay:'.4s'}}>
   <button style=${{background:'rgba(255,255,255,.14)',backdropFilter:'blur(20px)',color:'#fff',borderRadius:22,padding:12,display:'flex',gap:12,textAlign:'left',alignItems:'center'}} onClick=${()=>{onClose();go('suggestion',{id:'s1'})}}>
    <div class="grow col" style=${{gap:2}}>
     <div class="row" style=${{gap:8}}><div style=${{width:20,height:20,borderRadius:6,background:'#fff',color:'var(--ink)',display:'flex',alignItems:'center',justifyContent:'center'}}><${Icon} n="band" s=${13} w=${2.4}/></div><span style=${{fontWeight:500,fontSize:12.5,opacity:.75}}>FriendSync · jetzt</span></div>
     <div style=${{fontWeight:600,fontSize:15,marginTop:4}}>4 Freunde haben ab 18:30 Zeit</div>
     <div style=${{fontSize:13.5,opacity:.8,lineHeight:1.4}}>Younes, Marko, Lara und Noel sind frei. Lust auf Sunset-Bouldern?</div>
    </div>
    <${Thumb} a=${s} w=${62} h=${62} r=${12}/>
   </button>
   <div class="row" style=${{gap:8}}>
    <button class="tap" style=${{flex:1,background:'rgba(255,255,255,.14)',backdropFilter:'blur(20px)',borderRadius:16,padding:12,textAlign:'center',fontWeight:600,color:'#fff'}} onClick=${join}>Bin dabei</button>
    <button class="tap" style=${{flex:1,background:'rgba(255,255,255,.14)',backdropFilter:'blur(20px)',borderRadius:16,padding:12,textAlign:'center',fontWeight:600,color:'#fff'}} onClick=${onClose}>Später</button>
   </div>
  </div>
  <div style=${{flex:1}}></div>
  <div class="col" style=${{alignItems:'center',gap:16,paddingBottom:24}}>
   <div class="row shake" style=${{background:'rgba(255,255,255,.1)',borderRadius:999,padding:'8px 14px',fontWeight:500,fontSize:13,gap:8,opacity:.85}}><${Icon} n="vib" s=${16}/>Dein Band vibriert: kurz · kurz · lang</div>
   <button onClick=${onClose} style=${{width:134,height:5,borderRadius:3,background:'#fff'}} aria-label="Entsperren"></button>
  </div>
 </div>`}

/* ---------- Sheets & Dialoge ---------- */
function Sheet({sheet,close}){
 const {st,update,go,toast,pulse}=useApp();const t=sheet.type;
 let body=null;
 if(t==='status'){const times=['18:00','20:00','22:00','Open End'];body=html`<div class="col" style=${{gap:14}}>
   <div class="h2">Dein Status</div>
   <div class="card col" style=${{padding:'2px 0'}}>${Object.entries(MODES).map(([k,v],i)=>{const on=st.mode===k;return html`<div key=${k}>${i?html`<div class="divider" style=${{marginLeft:46}}></div>`:null}<button class="row tap" style=${{padding:'13px 16px',width:'100%'}} onClick=${()=>{update(s=>({...s,mode:k}));pulse(v.color,'Status: '+v.label)}}><span style=${{width:12,height:12,borderRadius:6,background:v.color,flexShrink:0,margin:'0 3px'}}></span><div class="grow"><div class="h3">${v.label}</div><div class="sub">${v.sub}</div></div>${on?html`<${Icon} n="check" s=${18} w=${2.6}/>`:null}</button></div>`})}</div>
   ${st.mode!=='hidden'?html`<div class="eyebrow" style=${{marginTop:4}}>Sichtbar bis</div><div class="row" style=${{gap:8,flexWrap:'wrap'}}>${times.map(x=>html`<button key=${x} class="chip tap" style=${{height:36,padding:'0 14px',fontSize:13.5,background:st.until===x?'var(--ink)':'#fff',color:st.until===x?'#fff':'var(--ink)',border:'1px solid '+(st.until===x?'var(--ink)':'var(--line)')}} onClick=${()=>update(s=>({...s,until:x}))}>${x}</button>`)}</div>`:null}
   <button class="btn btn-primary" style=${{marginTop:6}} onClick=${close}>Fertig</button></div>`}
 if(t==='window'){const w=sheet.w;const sug=w.sid&&st.suggestions.find(x=>x.id===w.sid);body=html`<div class="col" style=${{gap:14}}>
   <div><div class="eyebrow">${w.from} – ${w.to}</div><div class="h2" style=${{marginTop:4}}>${w.label}</div></div>
   <div class="card col" style=${{padding:'14px 16px',gap:10}}>${w.friends.map(fid=>{const f=fr(st,fid);return html`<div key=${fid} class="row"><${Av} f=${f} s=${34}/><span class="grow" style=${{fontWeight:500}}>${f.name}</span><span class="sub">${f.dist||''}</span></div>`})}</div>
   ${sug?html`<div class="card row" style=${{padding:10}}><${Thumb} a=${sug} w=${56} h=${56} r=${10}/><div class="grow"><div class="sub" style=${{color:'var(--accent-ink)',fontWeight:600}}>KI-Vorschlag</div><div class="h3">${sug.title}</div></div></div>
    <button class="btn btn-primary" onClick=${()=>{close();go('suggestion',{id:w.sid})}}>Vorschlag ansehen</button>`:html`
    <div class="card row" style=${{padding:14}}><${Tile} n="spark" bg="var(--accent-soft)" c="var(--accent-ink)"/><div><div class="sub" style=${{color:'var(--accent-ink)',fontWeight:600}}>Idee der KI</div><div class="h3">${w.idea}</div></div></div>
    <button class="btn btn-primary" onClick=${()=>{close();pulse('#5b5bd6','Anfrage gesendet');toast('Anfrage «'+w.idea+'» an '+w.friends.length+(w.friends.length===1?' Freund':' Freunde')+' gesendet')}}>Freunde fragen</button>`}
  </div>`}
 if(t==='decline'){const rs=[['moon','Zu müde'],['cal','Keine Zeit'],['spark','Lieber was anderes'],['wallet','Zu teuer']];body=html`<div class="col" style=${{gap:14}}>
   <div class="h2">Warum passt es nicht?</div><div class="sub">Die KI lernt daraus und schlägt beim nächsten Mal Besseres vor.</div>
   <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>${rs.map(([ic,l])=>html`<button key=${l} class="card press col" style=${{padding:14,gap:10}} onClick=${()=>{update(s=>({...s,suggestions:s.suggestions.map(x=>x.id===sheet.id?{...x,status:'declined'}:x)}));close();go('back');toast('Danke. Die KI merkt sich: '+l)}}><${Tile} n=${ic} s=${36}/><span style=${{fontWeight:600}}>${l}</span></button>`)}</div></div>`}
 if(t==='notifs'){body=html`<div class="col" style=${{gap:12}}>
   <div class="h2">Mitteilungen</div>
   <div class="card col" style=${{padding:'2px 0'}}>${st.notifs.map((n,i)=>html`<div key=${n.id}>${i?html`<div class="divider" style=${{marginLeft:68}}></div>`:null}<button class="row tap" style=${{padding:'12px 16px',width:'100%'}} onClick=${()=>{close();update(s=>({...s,readNotifs:true}));if(n.sid)go('suggestion',{id:n.sid});else if(n.icon==='hand')go('spontan');else go('friend',{id:'younes'})}}><${Tile} n=${n.icon} bg="var(--surface2)" c=${n.color} s=${38}/><div class="grow"><div class="h3" style=${{fontSize:14.5}}>${n.t}</div><div class="sub">${n.s}</div></div></button></div>`)}</div></div>`}
 if(t==='add'){body=html`<${AddFriend} close=${close}/>`}
 if(t==='protect'){const opts=[['Uni-Vorlesungen','Mo – Do · 09:00 – 12:00'],['Gym','Di & Do · 18:00 – 19:30'],['Lernzeit','Täglich · 14:00 – 16:00']];const left=opts.filter(o=>!st.protect.find(p=>p.label===o[0]));body=html`<div class="col" style=${{gap:12}}>
   <div class="h2">Schutzzeit hinzufügen</div><div class="sub">In diesen Zeiten teilt dein Band nichts und du bekommst keine Vorschläge.</div>
   ${left.length?html`<div class="card col" style=${{padding:'2px 16px'}}>${left.map(([l,tm],i)=>html`<div key=${l}>${i?html`<div class="divider"></div>`:null}<button class="row tap" style=${{padding:'12px 0',width:'100%'}} onClick=${()=>{update(s=>({...s,protect:[...s.protect,{id:'p'+Date.now(),label:l,time:tm,on:true}]}));close();toast('Schutzzeit «'+l+'» ist aktiv')}}><div class="grow"><div class="h3">${l}</div><div class="sub">${tm}</div></div><${Icon} n="plus" s=${18}/></button></div>`)}</div>`:html`<div class="sub">Alle Vorlagen sind schon hinzugefügt.</div>`}</div>`}
 return html`<div class="overlay" onClick=${close}><div class="sheet" onClick=${e=>e.stopPropagation()}><div class="grab"></div>${body}</div></div>`}

function AddFriend({close}){
 const {st,update,pulse,toast}=useApp();const [mode,setMode]=useState('tap');const [tapping,setTapping]=useState(false);
 const next=NEW_FRIENDS.find(n=>!st.friends.find(f=>f.id===n.id));
 const doTap=()=>{if(!next){toast('Alle Demo-Freunde sind schon verbunden.');return}setTapping(true);pulse('#d97706','Freundschafts-Tap');setTimeout(()=>{setTapping(false);update(s=>({...s,friends:[...s.friends,next]}));close();toast(next.name+' ist jetzt mit dir verbunden')},1500)};
 return html`<div class="col" style=${{gap:14}}>
  <div class="h2">Freund hinzufügen</div>
  <div class="seg"><button class=${mode==='tap'?'on':''} onClick=${()=>setMode('tap')}>Freundschafts-Tap</button><button class=${mode==='link'?'on':''} onClick=${()=>setMode('link')}>Einladen</button></div>
  ${mode==='tap'?html`<div class="col" style=${{gap:14,alignItems:'center',textAlign:'center'}}>
    <div class="row" style=${{justifyContent:'center',gap:0,padding:'12px 0'}}><div style=${{transform:tapping?'rotate(-6deg) translateX(12px)':'rotate(-12deg)',transition:'transform .5s'}}><${Bracelet} w=${120} led=${tapping?'#d97706':'#64748b'} vib=${tapping}/></div><div style=${{transform:tapping?'rotate(6deg) scaleX(-1) translateX(12px)':'rotate(12deg) scaleX(-1)',transition:'transform .5s'}}><${Bracelet} w=${120} led=${tapping?'#d97706':'#64748b'} vib=${tapping}/></div></div>
    <div class="sub" style=${{fontSize:14.5}}>Haltet eure Bänder kurz aneinander. Wenn beide orange leuchten, seid ihr verbunden.</div>
    <button class="btn btn-primary" onClick=${doTap} disabled=${tapping}>${tapping?'Verbinde …':'Tap simulieren'}</button></div>`:
  html`<div class="col" style=${{gap:12}}>
    <div class="card row" style=${{padding:12}}><span class="ink2"><${Icon} n="link" s=${19}/></span><span class="grow" style=${{fontWeight:500,fontSize:14}}>friendsync.app/i/simi-7f3a</span><button class="chip c-grey tap" style=${{height:30}} onClick=${()=>{try{navigator.clipboard.writeText('friendsync.app/i/simi-7f3a').catch(()=>{})}catch(e){}toast('Link kopiert')}}>Kopieren</button></div>
    <div class="card row" style=${{padding:12,background:'var(--amber-soft)',borderColor:'#f3dfb8',alignItems:'flex-start'}}><span style=${{color:'var(--amber-ink)'}}><${Icon} n="alert" s=${18}/></span><span class="sub" style=${{color:'var(--amber-ink)',fontWeight:500}}>Ohne eigenes FriendSync-Band sieht die App nicht, wann dein Freund Zeit hat. Er kann nur per Mitteilung mitmachen.</span></div>
  </div>`}
 </div>`}

function Dialog({d,close}){
 const {update,toast,startOnboarding}=useApp();
 let c=null;
 if(d.type==='delete')c=html`<div style=${{display:'flex',justifyContent:'center'}}><${Tile} n="trash" bg="var(--red-soft)" c="var(--red)" s=${52}/></div><div class="h2" style=${{margin:'14px 0 8px'}}>Alle Daten löschen?</div><div class="sub" style=${{marginBottom:20}}>Standort-, Kalender- und Aktivitätsdaten werden vom Band und aus der App entfernt. Deine Freunde bleiben verbunden.</div>
  <div class="col" style=${{gap:10}}><button class="btn" style=${{background:'var(--red)'}} onClick=${()=>{update(s=>({...s,data:{loc:0,cal:0,act:0}}));close();toast('Alle gespeicherten Daten wurden gelöscht')}}>Löschen</button><button class="btn btn-secondary" onClick=${close}>Abbrechen</button></div>`;
 if(d.type==='onboard')c=html`<div style=${{display:'flex',justifyContent:'center'}}><${Tile} n="reset" s=${52}/></div><div class="h2" style=${{margin:'14px 0 8px'}}>Onboarding wiederholen?</div><div class="sub" style=${{marginBottom:20}}>Du koppelst dein Band neu und gehst die Freigaben nochmals durch.</div>
  <div class="col" style=${{gap:10}}><button class="btn btn-primary" onClick=${()=>{close();startOnboarding()}}>Starten</button><button class="btn btn-secondary" onClick=${close}>Abbrechen</button></div>`;
 return html`<div class="overlay" style=${{alignItems:'center'}} onClick=${close}><div class="dialog" onClick=${e=>e.stopPropagation()}>${c}</div></div>`}

/* ---------- App ---------- */
const TABS=[['heute','home','Heute'],['freunde','users','Freunde'],['vorschlaege','spark','Vorschläge'],['band','band','Band'],['profil','user','Profil']];
const FLOWS=[
 ['onboarding','Onboarding','Armband koppeln & Daten freigeben'],
 ['push','Push & Vibration','KI-Vorschlag kommt rein'],
 ['accept','Vorschlag annehmen','Live-Zusagen bis zum Treffen'],
 ['spontan','Spontan-Modus','«Ich hab Lust» per Tap'],
 ['window','Wer hat Zeit?','Freie Zeitfenster heute'],
 ['friends','Freunde','Status, Profil, Freundschafts-Tap'],
 ['band','Armband','Status-Modi & Vibrationen'],
 ['privacy','Privatsphäre','Freigaben, Schutzzeiten, Löschen'],
];

function App(){
 const [st,setSt]=useState(load);
 const [tab,setTabS]=useState('heute');
 const [stack,setStack]=useState([]);
 const [sheet,setSheet]=useState(null);const [dialog,setDialog]=useState(null);const [toastMsg,setToast]=useState(null);
 const [lock,setLock]=useState(false);const [fx,setFx]=useState(null);const [flow,setFlow]=useState(null);const [obKey,setObKey]=useState(0);
 const scrRef=useRef(null);const toastT=useRef();const fxT=useRef();
 useEffect(()=>save(st),[st]);
 useEffect(()=>{if(scrRef.current)scrRef.current.scrollTop=0},[tab,stack.length]);
 const update=fn=>setSt(s=>fn(s));
 const toast=m=>{clearTimeout(toastT.current);setToast({m,k:Date.now()});toastT.current=setTimeout(()=>setToast(null),2600)};
 const pulse=(color,label,vib=true)=>{clearTimeout(fxT.current);setFx({color,label,vib,k:Date.now()});fxT.current=setTimeout(()=>setFx(null),2600)};
 const go=(name,params={},replace)=>{if(name==='back'){setStack(s=>s.slice(0,-1));return}if(name==='vorschlaegeTab'){setStack([]);setTabS('vorschlaege');return}setStack(s=>replace?[...s.slice(0,-1),{name,params}]:[...s,{name,params}])};
 const back=()=>setStack(s=>s.slice(0,-1));
 const setTab=t=>{setStack([]);setTabS(t)};
 const reset=()=>{setSt(initial());setStack([]);setTabS('heute');setSheet(null);setDialog(null);setLock(false);setFlow(null);toast('Prototyp zurückgesetzt')};
 const startOnboarding=()=>{setSt({...initial(),onboarded:false});setStack([]);setSheet(null);setDialog(null);setLock(false);setObKey(k=>k+1)};
 const openSheet=s=>setSheet(s);const openDialog=d=>setDialog(d);
 const ctx={st,update,go,back,setTab,toast,pulse,openSheet,openDialog,reset,startOnboarding,fx};

 const runFlow=k=>{setFlow(k);setSheet(null);setDialog(null);setLock(false);
  if(k!=='onboarding'&&!st.onboarded)update(s=>({...s,onboarded:true}));
  if(k==='onboarding'){startOnboarding();return}
  if(k==='push'){setStack([]);setTabS('heute');setTimeout(()=>{setLock(true);pulse('#5b5bd6','Neuer Vorschlag')},150);return}
  if(k==='accept'){setTabS('vorschlaege');setStack([{name:'suggestion',params:{id:'s1'}}]);return}
  if(k==='spontan'){setTabS('heute');setStack([{name:'spontan',params:{}}]);return}
  if(k==='window'){setStack([]);setTabS('heute');setTimeout(()=>{if(scrRef.current)scrRef.current.scrollTo({top:560,behavior:'smooth'})},120);setTimeout(()=>setSheet({type:'window',w:TL[3]}),700);return}
  if(k==='friends'){setTabS('freunde');setStack([]);return}
  if(k==='band'){setTabS('band');setStack([]);return}
  if(k==='privacy'){setTabS('profil');setStack([{name:'privacy',params:{}}]);return}
 };

 const top=stack[stack.length-1];
 let screen;
 if(!st.onboarded)screen=html`<${Onboarding} key=${obKey}/>`;
 else if(top){const p=top.params;screen=top.name==='suggestion'?html`<${Suggestion} key=${'s'+p.id} id=${p.id}/>`:top.name==='meetup'?html`<${Meetup} key=${'m'+p.id} id=${p.id}/>`:top.name==='friend'?html`<${Friend} key=${'f'+p.id} id=${p.id}/>`:top.name==='spontan'?html`<${Spontan} key=${'sp'+stack.length}/>`:top.name==='privacy'?html`<${Privacy}/>`:null}
 else screen=tab==='heute'?html`<${Heute}/>`:tab==='freunde'?html`<${Freunde}/>`:tab==='vorschlaege'?html`<${Vorschlaege}/>`:tab==='band'?html`<${Band}/>`:html`<${Profil}/>`;
 const photoTop=top&&['suggestion','meetup'].includes(top.name);
 const dark=lock||(top&&top.name==='spontan');
 const openCount=st.suggestions.filter(s=>s.status==='open').length;
 useNow();
 const mode=MODES[st.mode];const ledColor=fx?fx.color:mode.color;

 return html`<${Ctx.Provider} value=${ctx}>
 <div class="stage">
  <aside class="side">
   <div class="row" style=${{gap:12}}><div style=${{width:44,height:44,borderRadius:12,background:'var(--ink)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center'}}><${Icon} n="band" s=${24}/></div><div style=${{fontSize:28,fontWeight:700,letterSpacing:'-.03em'}}>FriendSync</div></div>
   <div class="sub" style=${{fontSize:15,lineHeight:1.55}}><span style=${{color:'var(--ink)',fontWeight:600}}>Lösungsvariante 2</span> · Das smarte Freundschaftsarmband. Klickbarer Prototyp, deine Änderungen bleiben in diesem Browser gespeichert.</div>
   <div class="row" style=${{gap:10}}>
    <button class="btn btn-secondary" style=${{flex:1,height:42}} onClick=${reset}><${Icon} n="reset" s=${17}/>Zurücksetzen</button>
    <button class="btn btn-secondary" style=${{flex:1,height:42}} onClick=${()=>runFlow('onboarding')}><${Icon} n="userplus" s=${17}/>Neuer Nutzer</button>
   </div>
   <div class="card row" style=${{padding:'12px 16px',gap:14}}>
    <div style=${{width:96,display:'flex',justifyContent:'center'}}><${Bracelet} w=${92} led=${ledColor} vib=${fx&&fx.vib} key=${fx?fx.k:'idle'}/></div>
    <div class="grow"><div class="eyebrow">Dein Armband · live</div><div class="h3" style=${{marginTop:4}}>${fx?fx.label:mode.label}</div><div class="sub" style=${{fontSize:13}}>${fx?(fx.vib?'Vibriert gerade':'Leuchtet'):'Das Licht zeigt deinen Status'}</div></div>
   </div>
   <div class="eyebrow" style=${{marginTop:8}}>Flows ausprobieren</div>
   <div class="col" style=${{gap:8}}>
    ${FLOWS.map(([k,t,s],i)=>html`<button key=${k} class=${'flowbtn'+(flow===k?' on':'')} onClick=${()=>runFlow(k)}><span class="n">${i+1}</span><span class="col"><span style=${{fontWeight:600,fontSize:15}}>${t}</span><span class="sub" style=${{fontSize:13.5}}>${s}</span></span></button>`)}
   </div>
  </aside>

  <div class="phone">
   <div class="statusbar" style=${{color:dark||photoTop?'#fff':undefined,background:dark||photoTop?'transparent':'var(--bg)',position:dark||photoTop?'absolute':'relative',left:0,right:0,top:0,zIndex:46,textShadow:photoTop?'0 1px 4px rgba(0,0,0,.3)':'none'}}>
    <span>${clockStr()}</span>
    <span class="row" style=${{gap:6}}><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".75" y=".75" width="21.5" height="10.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.6" fill="currentColor"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></span>
   </div>
   <div class="scr" ref=${scrRef}>${screen}</div>
   ${st.onboarded&&!(top&&top.name==='spontan')?html`<nav class="tabbar">
    ${TABS.map(([k,ic,l])=>{const on=tab===k;return html`<button key=${k} class=${'tab'+(on?' on':'')+(k==='vorschlaege'?' center':'')} onClick=${()=>setTab(k)}>
     <${Icon} n=${ic} s=${23} w=${on?2.1:1.8}/>${l}<span class="dot"></span>
     ${k==='vorschlaege'&&openCount?html`<span class="badge">${openCount}</span>`:null}
    </button>`})}
   </nav>`:null}
   ${lock?html`<${Lock} onClose=${()=>setLock(false)}/>`:null}
   ${sheet?html`<${Sheet} sheet=${sheet} close=${()=>setSheet(null)}/>`:null}
   ${dialog?html`<${Dialog} d=${dialog} close=${()=>setDialog(null)}/>`:null}
   ${toastMsg?html`<div class="toast" key=${toastMsg.k}><${Icon} n="check" s=${17}/>${toastMsg.m}</div>`:null}
  </div>
 </div>
 <//>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
